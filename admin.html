<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – Kindness Board</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --primary: #0284C7;
      --primary-light: #E0F2FE;
      --bg-main: #F8FAFC;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-light: #E2E8F0;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .admin-navbar {
      background: #ffffff;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-brand { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .admin-brand i { color: var(--primary); }

    /* Login Screen */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: #ffffff;
      padding: 3rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h2 { margin-bottom: 0.5rem; font-size: 1.5rem; }
    .login-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
    
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    /* Dashboard */
    .dashboard-container {
      display: none;
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .dashboard-header h1 { font-size: 1.75rem; }
    .btn-outline {
      background: white;
      border: 1px solid var(--border-light);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
    }
    .stat-num { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 0.25rem; }
    .stat-lbl { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-light); }
    .tab-btn {
      background: none;
      border: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Table */
    .table-container {
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1rem 1.25rem; text-align: left; border-bottom: 1px solid var(--border-light); }
    th { background: #f8fafc; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
    tbody tr:hover { background: #f1f5f9; }
    .message-cell { max-width: 300px; }
    .message-text { font-style: italic; color: var(--text-main); }
    
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
    }
    .badge-success { background: #DCFCE7; color: #16A34A; }
    
    .actions-cell { display: flex; gap: 0.5rem; }
    .btn-sm {
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-text { background: none; border: none; color: var(--accent-red); font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

    /* Toast */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    .toast { background: #333; color: white; padding: 1rem 1.5rem; border-radius: var(--radius-sm); margin-top: 0.5rem; transition: opacity 0.3s, transform 0.3s; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="admin-navbar">
    <div class="admin-brand"><i data-lucide="shield"></i> Kindness Board Admin</div>
    <a href="index.html" class="btn-outline" style="text-decoration: none; color: inherit;">
      <i data-lucide="home"></i> Back to Site
    </a>
  </nav>

  <!-- Login Screen -->
  <div class="login-container" id="loginView">
    <div class="login-card">
      <h2>Admin Login</h2>
      <p>Enter your credentials to access the moderation dashboard.</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div class="dashboard-container" id="dashboardView">
    <div class="dashboard-header">
      <h1>Moderation Dashboard</h1>
      <div>
        <button class="btn-outline" onclick="exportMessagesCSV()"><i data-lucide="download"></i> Export CSV</button>
        <button class="btn-outline" onclick="logout()" style="margin-left: 0.5rem;"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-num" id="statPending">0</span>
        <span class="stat-lbl">Pending Review</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statApproved">0</span>
        <span class="stat-lbl">Approved</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statRejected">0</span>
        <span class="stat-lbl">Rejected</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-lbl">Total Messages</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending', this)">Pending Queue (<span id="tabCountPending">0</span>)</button>
      <button class="tab-btn" data-tab="approved" onclick="switchTab('approved', this)">Approved</button>
      <button class="tab-btn" data-tab="rejected" onclick="switchTab('rejected', this)">Rejected</button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Author / Role</th>
            <th>Message Content</th>
            <th>Submitted</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rendered via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseConfig.js"></script>
  <!-- Storage Engine -->
  <script src="storage.js"></script>
  <!-- Admin Script -->
  <script src="admin.js"></script>

</body>
</html>
